<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AB Admin</title>
</head>

<body>

    <!-- Заголовок панели -->
    <h1>AB Admin</h1>

    <!-- Выбор модели -->
    <select id="modelSelect"></select>

    <!-- Кнопка загрузки данных выбранной модели -->
    <button onclick="loadList()">Загрузить</button>

    <hr>

    <!-- Блок создания новой записи -->
    <h2>Создание</h2>

    <!-- Подстава формы по схеме модели -->
    <div id="createForm"></div>

    <!-- Кнопка отправки данных на сервер -->
    <button onclick="createItem()">Создать</button>

    <hr>

    <!-- Фильтр по данным -->
    <input id="filterInput" placeholder="Фильтр">

    <!-- Запуск поиска с фильтром -->
    <button onclick="loadList()">Поиск</button>

    <hr>

    <!-- Таблица для отображения данных -->
    <table>
        <thead>
            <!-- Заголовки колонок -->
            <tr id="tableHeader"></tr>
        </thead>

        <!-- Тело таблицы с данными -->
        <tbody id="tableBody"></tbody>
    </table>

    <hr>

    <!-- Переход назад -->
    <button onclick="prevPage()">◀</button>

    <!-- Текущая страница -->
    <span id="pageLabel">1</span>

    <!-- Переход вперед -->
    <button onclick="nextPage()">▶</button>

    <!-- Подключение схем моделей -->
    <script src="sc.js"></script>

    <!-- API слой для запросов к backend -->
    <script src="api.js"></script>

    <!-- Основная логика админа -->
    <script src="admin.js"></script>

</body>
</html>
