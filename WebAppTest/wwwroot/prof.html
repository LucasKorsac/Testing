<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="#">Профиль</a></li>
                <li><a href="#">Главная страница</a></li>
                <li><a href="#">Управление</a></li>
                <li><a href="#">Справка</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1>Профиль</h1>

        <!-- Блок профиля -->
        <section>

            <!-- Аватар -->
            <div>
                <img src="#" alt="Аватар пользователя">
            </div>

            <!-- Кнопка редактирования -->
            <div>
                <button>Редактировать профиль</button>
            </div>

            <!-- Имя -->
            <div>
                <label for="firstName">Имя:</label>
                <input type="text" id="firstName" name="firstName" value="Имя_пользователя">
            </div>

            <!-- Фамилия -->
            <div>
                <label for="lastName">Фамилия:</label>
                <input type="text" id="lastName" name="lastName" value="Фамилия_пользователя">
            </div>

            <!-- Ссылка -->
            <div>
                <p>@ссылка_на_профиль</p>
            </div>

        </section>

        <!-- Информация о пользователе -->
        <section>
            <h2>Информация о пользователе</h2>
            <textarea rows="6" cols="50">Текст написанный пользователем</textarea>
        </section>

        <!-- Комментарий (как на макете) -->
        <aside>
            <p><strong>Лукас</strong> (1 day ago)</p>
            <p>При изменении элементы в которых возможны корректировки активны</p>
        </aside>

    </main>

</body>
</html>
