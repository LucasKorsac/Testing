<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>A/B Test Charts</title>

    <!-- Подключение библиотеки для построения графиков -->
    <script src="https://cdn.jsdelivr.net/npm/graph.js"></script>
</head>

<body>

    <!-- Заголовок страницы -->
    <h1>A/B Test</h1>

    <!-- Выпадающий список для выбора A/B теста -->
    <select id="testSelect"></select>

    <!-- Кнопка для загрузки данных и построения графика -->
    <button onclick="loadChart()">Показать график</button>

    <hr>

    <!-- canvas элемент, в котором рисуется график -->
    <canvas id="grap"></canvas>

    <!-- Подключение логики построения графиков -->
    <script src="graph.js"></script>

</body>
</html>
